<script>
const KEYMAP={Backquote:{n:'़',s:'द्य'},Digit1:{n:'१',s:'।'},Digit2:{n:'२',s:'/'},Digit3:{n:'३',s:':'},Digit4:{n:'४',s:'?'},Digit5:{n:'५',s:'-'},Digit6:{n:'६',s:'‘'},Digit7:{n:'७',s:'’'},Digit8:{n:'८',s:'द्व'},Digit9:{n:'९',s:'त्र'},Digit0:{n:'०',s:'ऋ'},Minus:{n:'·',s:'्'},Equal:{n:'ृ',s:'ॄ'},KeyQ:{n:'ु',s:'फ'},KeyW:{n:'ू',s:'ॅ'},KeyE:{n:'म',s:'म्'},KeyR:{n:'त',s:'त्'},KeyT:{n:'ज',s:'ज्'},KeyY:{n:'ल',s:'ल्'},KeyU:{n:'न',s:'न्'},KeyI:{n:'प',s:'प्'},KeyO:{n:'व',s:'व्'},KeyP:{n:'च',s:'च्'},BracketLeft:{n:'ख्',s:'क्ष्'},BracketRight:{n:',',s:'ौ'},Backslash:{n:'ो',s:'द्ध'},KeyA:{n:'ं',s:'ॉ'},KeyS:{n:'े',s:'ै'},KeyD:{n:'क',s:'क्'},KeyF:{n:'ि',s:'थ्'},KeyG:{n:'ह',s:'ळ'},KeyH:{n:'ी',s:'भ्'},KeyJ:{n:'र',s:'श्र'},KeyK:{n:'ा',s:'ज्ञ'},KeyL:{n:'स',s:'स्'},Semicolon:{n:'य',s:'रू'},Quote:{n:'श्',s:'ष्'},KeyZ:{n:'्र',s:'र्'},KeyX:{n:'ग',s:'ग्'},KeyC:{n:'ब',s:'ब्'},KeyV:{n:'अ',s:'ट'},KeyB:{n:'इ',s:'ठ'},KeyN:{n:'द',s:'छ'},KeyM:{n:'उ',s:'ड'},Comma:{n:'ए',s:'ढ'},Period:{n:'ण्',s:'झ'},Slash:{n:'ध्',s:'घ'},Space:{n:' ',s:' '}};
const HALF={'म्':'म','त्':'त','ज्':'ज','ल्':'ल','न्':'न','प्':'प','व्':'व','च्':'च','छ्':'छ','क्':'क','ग्':'ग','ब्':'ब','र्':'र','स्':'स','श्':'श','ष्':'ष','भ्':'भ','थ्':'थ','ख्':'ख','ण्':'ण','ध्':'ध','क्ष्':'क्ष'};
const MAT=new Set(['ी','ृ','ॉ','ॅ','ॊ','ॆ','ा','ॄ','ः','ो','ौ','े','ै','ु','ू']);
const IV=new Set(['अ','आ','इ','ई','उ','ऊ','ए','ऐ','ओ','औ','ऋ']);
// Remington GAIL typewriter-style independent-vowel compositions.
// The reference uses key sequences, not raw Unicode order. Keep the result as
// normal Unicode so sequences such as अ+ा, ए+े, इ+ी and इ+र् do not remain as
// broken strings like "अा", "एे", "इी" or "इर्".
const VOWEL_COMPOSE={
  'अा':'आ','अि':'इ','अी':'ई','अु':'उ','अू':'ऊ','अृ':'ऋ',
  'इी':'ई','इर्':'ई','उू':'ऊ','अे':'ए','अै':'ऐ','एे':'ऐ','अो':'ओ','अौ':'औ'
};
let buffer='',pendingI=false,start=0;
function graphemes(str){
  if(!str)return[];
  try{if(typeof Intl!=='undefined'&&Intl.Segmenter){return[...new Intl.Segmenter('hi',{granularity:'grapheme'}).segment(str)].map(s=>s.segment)}}catch(e){}
  const combining=/[\u0900-\u0903\u093a-\u094f\u0951-\u0957\u0962\u0963]/;
  const out=[];let i=0;
  while(i<str.length){let g=str[i];i++;while(i<str.length&&combining.test(str[i])){g+=str[i];i++}out.push(g)}
  return out;
}
function clusterize(word){
  const g=graphemes(word);let idx=0;const out=[];
  for(const seg of g){out.push({text:seg,start:idx,end:idx+seg.length});idx+=seg.length}
  return out;
}
function editDistance(a,b){
  const m=a.length,n=b.length,dp=[];
  for(let i=0;i<=m;i++){dp.push([]);for(let j=0;j<=n;j++){
    if(i===0)dp[i][j]=j;else if(j===0)dp[i][j]=i;
    else dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }}
  return dp[m][n];
}
// Real-exam style word grading: an exact match is no mistake, a totally missing/garbled word
// is a "full" mistake, and a word that's just one grapheme off (a slipped matra, a missed half-letter)
// is a "half" mistake — matching how SSC/CPCT-style Net WPM formulas grade errors.
function classifyMistake(target,typed){
  if(typed===target)return'none';
  if(!typed)return'full';
  return editDistance(graphemes(target),graphemes(typed))<=1?'half':'full';
}
function appendEngineChar(ch){
  // Matras after an independent vowel can represent the next independent vowel
  // in the Remington typewriter sequence (for example ए + े = ऐ).
  if(MAT.has(ch)){
    const gs=graphemes(buffer);
    const last=gs[gs.length-1]||'';
    const composed=VOWEL_COMPOSE[last+ch];
    if(composed){gs[gs.length-1]=composed;buffer=gs.join('');return;}
  }
  buffer+=ch;
}
// Remington GAIL Unicode engine. KeyboardEvent.code owns physical key mapping;
// composition below mirrors typewriter key sequences and emits normalized Unicode.
function press(code,shift){
  const ch=(KEYMAP[code]||{})[shift?'s':'n'];
  if(ch===undefined)return;

  // ि is pressed before the following base letter in GAIL.
  if(ch==='ि'){
    if(pendingI){appendEngineChar('ि');pendingI=false;}
    else pendingI=true;
    return;
  }

  if(pendingI){
    // A following independent vowel also uses the typewriter vowel composition.
    if(IV.has(ch)){
      const composed=VOWEL_COMPOSE[ch+'ि'];
      buffer+=composed||ch+'ि';
    }else if(ch.endsWith('्')){
      // Preserve explicit half letters; do not strip their virama.
      buffer+=ch+'ि';
    }else{
      // Canonical Unicode order is consonant + ि even though the physical key
      // order was ि then consonant.
      buffer+=ch+'ि';
    }
    pendingI=false;
    return;
  }

  appendEngineChar(ch);

ल की भाषा में टिकट के नाम से भी जाना जाता है और दूसरा तरीका पक्षराहित दावेदार के तौर पर है। दोनो ही तरीकों में दावेदार को नामांकन पत्र भरना जरूरी होता है।", "passage-3": "मौलिक अधिकार भारतीय संविधान का अंग हैं। सभी नागरिकों के बुनियादी मानवाधिकारों को मौलिक अधिकारों के रूप में परिभाषित किया गया है। संविधान में यह कहा गया है कि किसी भी इंसान के लिंग और जाति और समुदाय या पंथ या जनम की जगह की दशा के आधार पर भेदभाव ना करके उन को ये अधिकार दिए जाते हैं। ये सटीक प्रतिबंधों के अधीन अदालतों ने लागू किए हैं। इन को नागरिक संविधान के रूप में भारत के संविधान ने गारंटी दी जाती है। जिसके अनुसार सभी लोग भारतीय नागरिकों के रूप में सदभाव और शांति से अपना जीवन यापन कर सकते हैं। भारत का संविधान अपने नागरिकों को मौलिक अधिकार की गारंटी देता है और नागरिकों के पास भाषण को जाहिर करने का अधिकार हो सकता है लेकिन इन अधिकारों से जुडे कुछ प्रतिबंध और अपवाद भी हैं। एक नागरिक पूरी तरह से मौलिक अधिकारों का प्रयोग नहीं कर सकता है। लेकिन कुछ संवैधानिक प्रतिबंध के साथ वही नागरिक अपने अधिकारों का आनंद उठा सकता है। भारत का संविधान इन अधिकारों को प्रयोग में लाने पर कुछ सीमाएं लागू करता है ताकि नैतिकता बरकरार रहे। संविधान हमेशा इंसान के हितों के साथ साथ सांप्रदायिक हितों की भी रक्षा करता है। उदाहरण के लिए समुदाय का अधिकार और नैतिकता और शारीरिक हित में प्रदेशों के जरिये सीमाओं के अधीन है। हमारे संविधान ने देश को उचित सीमाएं लागू करने के लिए अधिकार दिया है। इसलिए यह समुदाय के हित के लिए जरूरी है। हमारा संविधान इंसान की आजादी और सामाजिक नियंत्रण के बीच संतुलन को रोकने और एक कलयाणकारी प्रदेश को बनाए रखने का प्रयास करता है जहां सांप्रदायिक हित इंसानों के हितों पर जोर देता है। सभा करने की आजादी भी प्रदेश के जरिये लगायी जाने वाली उचित सीमाओं के अधीन है और सभी जन के आदेशों के हित में होनी चाहिए। प्रेस की आजादी और जो वयकत की आजादी में शामिल है को भी उचित सीमाओं के अधीन किया जाता है और सरकार प्रेस की आजादी पर देश के बेहतर हित में या अदालत की अवमानना और मानहानि या पीडन से बचने के लिए प्रतिबंध लगा सकती है। जब बंगलादेश की आजादी की लडाई बंद हो चुका था और देश उस समय भी अतिक्रमण से उबरने की कोशिश कर रहा था। उस समय के दौरान शिवसेना और असम गण परिषद जैसे जगह और क्षेत्रीय दलों में अधिक असंतोष पैदा हो रहा था। फिर भी इससे इनकार नहीं किया जा सकता है कि भारत सरकार ने इन सबसे निपटने में आईपीसी के लागू करने के बारे में अधिक प्रतिक्रिया दिखाई। समान अवसर प्रदान करने के लिए और सरकार की सेवाओं में अनुसूचित जाति और अनुसूचित जनजाति और बाकी पिछडे लोगों के सिवाय सैनिकों की विधवाएं और शारीरिक रूप से विकलांग इंसान को कोई आरक्षण नहीं होगा। इसमें भाषण को वयकत और बोलने की आजादी और यूनियन और सहयोगी बनने की आजादी तथा भारत में कहीं भी यात्रा करने की आजादी और भारत के किसी भी भाग में रहने और बसने की आजादी और किसी पेशे का चयन करने की आजादी शामिल है। इस अधिकार के तहत यह भी कहा गया है कि भारत के किसी भी नागरिक को देश के किसी भी भाग में जमीन खरीदने और बेचने और बनाए रखने का पूरा अधिकार है। अंत में कहा गया है कि भारत के सभी नागरिकों के लिए आजादी होगी।", "passage-4": "भारत के प्रधानमंत्री श्री मोदी जी का पूरा नाम नरेंद्र दामोदर दास मोदी है। मोदी जी को भारतीय जनता दल में तीन बार गुजरात के चुनावों में जीत हासिल हुई थी। गुजरात के मंत्री रहते हुए उनकी छवि एक सफल और ईमानदार और कठोर प्रशासक की बनी। जिसके चलते बाद के चुनाव में भाजपा ने उनको प्रधानमंत्री पद का दावेदार घोषित कर चुनाव लडा। और भाजपा के इस चुनाव ने मोदी को प्रभावी इंसान के रूप में उभारा। मोदी के करिशमाई भाषण शैली और विकास चुनाव घोषणा पत्र के चलते उनको जनता का पूरा साथ मिला और पहली बार भाजपा पूरी बहुमत के साथ जीतकर शासन में आई। मोदी अपने समय के प्रभावी नेता है और साथ ही सुशिक्षित भी हैं। मोदी जी ने राजनीति विज्ञान में एमए की उपाधि ली है। आज मोदी जी को भारत के इतिहास का सफल शिखर पुरुष माना जाता है। लेकिन उनका जीवन हमेशा इतना ही आसान नहीं रहा है। मोदी का बचपन बहुत कठिन था। बचपन में उन को रेलवे पर चाय बेचने के काम में अपने पिता का हाथ बंटाना पडता था और साथ ही शिक्षा भी ग्रहण करने जाना पडता था। बडे होने के बाद उन को सब कुछ खुद ही करना पडा। आगे चल कर वे आर एस एस के सफलतम प्रचारक बने। फिर तो मोदी जी ने सक्रीय राजनीति की राह पकडी और अलग अलग प्रदेशो के प्रभारी रहते हुए प्रशासन के गुण सीखे। फिर गुजरात के मंत्री बनने के बाद मोदी जी ने सफलता के नए आयाम पा लिये और आज उनकी function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function mark(code,cls){const el=document.querySelector('#kb .key[data-code="'+code+'"]');if(el)el.classList.add(cls)}
function findDirect(ch){

function updateKbHighlight(p){

  const passOnly=mode.value!=='free';
  accEl.style.display=passOnly?'':'none';
  errEl.style.display=passOnly?'':'none';
  wordRow.style.display=(mode.value==='word-normal'||mode.value==='word-shift')?'block':'none';
  if(passOnly){
    const pw=passageWords(),ptxt=passageText();
    wordLenEl.textContent=pw.length?('WL '+(graphemes(ptxt).length/pw.length).toFixed(2)):'WL —';
    wordLenEl.style.display='';
  }else{
    wordLenEl.style.display='none';
  }
  renderPassage();
}
function computeStats(){
  const isFree=mode.value==='free';
  if(isFree)return{correct:0,incorrect:0,errors:[],isFree:true,total:0};
  let correct=0,incorrect=0,errors=[],fullMistakes=0,halfMistakes=0,grossChars=0;
  completedWords.forEach((w,idx)=>{
    const tG=graphemes(w.target),yG=graphemes(w.typed);
    grossChars+=yG.length+1; // +1 for the space keystroke that finalized this word
    if(w.mistake==='full')fullMistakes++;else if(w.mistake==='half')halfMistakes++;
    if(w.correct){correct+=tG.length;return}
    let c=0;const len=Math.min(tG.length,yG.length);
    for(let i=0;i<len;i++)if(tG[i]===yG[i])c++;
    correct+=c;incorrect+=Math.max(tG.length,yG.length)-c;
    errors.push({idx:idx,expected:w.target,typed:w.typed});
  });
  // Include the word currently being typed (not yet submitted with Space) so WPM/accuracy
  // update live instead of only jumping once a word is finished.
  const curTarget=passageWords()[wordIndex];
  if(curTarget!==undefined&&buffer.length>0){
    const tG=graphemes(curTarget),yG=graphemes(buffer);
    grossChars+=yG.length;
    const len=Math.min(tG.length,yG.length);let c=0;
    for(let i=0;i<len;i++)if(tG[i]===yG[i])c++;
    correct+=c;incorrect+=Math.max(tG.length,yG.length)-c;
  }
  return{correct:correct,incorrect:incorrect,errors:errors,isFree:false,total:correct+incorrect,wordsTotal:completedWords.length,wordsCorrect:completedWords.filter(w=>w.correct).length,fullMistakes:fullMistakes,halfMistakes:halfMistakes,grossChars:grossChars}
}
// Real-exam ("CPCT/SSC style") Net WPM formula:
// Net WPM = (gross keystrokes ÷ 5 − full mistakes − half mistakes ÷ 2) ÷ minutes
function wpmFromStats(st,mins){
  mins=Math.max(mins,0.001);
  const grossWpm=Math.round((st.grossChars/5)/mins);
  const netWpm=Math.max(0,Math.round((st.grossChars/5-st.fullMistakes-st.halfMistakes/2)/mins));
  return{grossWpm:grossWpm,netWpm:netWpm};
}
function fmtTime(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){
  if(!start||paused)return;
  const elapsed=performance.now()-start-pausedTotal,mins=elapsed/60000;
  if(timeLimitMs>0&&elapsed>=timeLimitMs&&!finished){timeEl.textContent=fmtTime(0);timeUp();return}
  timeEl.textContent=timeLimitMs>0?fmtTime(timeLimitMs-elapsed):fmtTime(elapsed);
  if(mins<=0)return;
  const st=computeStats();
  let wpm;
  if(st.isFree){
    const words=buffer.trim().split(/\s+/).filter(Boolean).length;
    wpm=Math.round(words/mins);
  }else{
    wpm=wpmFromStats(st,mins).netWpm;
    const acc=st.total?Math.round(st.correct/st.total*100):100;
    accEl.textContent=acc+'% acc';
    errEl.textContent=st.incorrect+' err';
  }
  wpmEl.textContent=wpm+' WPM';
}
function resetTest(){
  buffer='';pendingI=false;start=0;pausedTotal=0;paused=false;finished=false;
  wordIndex=0;completedWords=[];
  clearTimeout(idleTimer);
  doc.value='';wpmEl.textContent='0 WPM';accEl.textContent='100% acc';errEl.textContent='0 err';
  timeEl.textContent=timeLimitMs>0?fmtTime(timeLimitMs):'00:00';
  pauseBtn.textContent='Pause';
  examBadge.style.display=examMode.checked?'':'none';
  hideErrorPanel();
  renderPassage();
}
function resetIdle(){
  clearTimeout(idleTimer);
  if(mode.value==='free')return;
  idleTimer=setTimeout(()=>{if(start&&!paused&&!finished&&(buffer.length>0||wordIndex>0))pauseTest()},IDLE_MS);
}
const errTitle=document.getElementById('errTitle'),resultStats=document.getElementById('resultStats'),resultBtns=document.getElementById('resultBtns'),retryBtn=document.getElementById('retryBtn'),newWordsBtn=document.getElementById('newWordsBtn');
function showErrorPanel(customMsg){
  const st=computeStats();
  errTitle.textContent='MISTAKE REVIEW';
  resultStats.classList.remove('show');resultStats.style.display='none';
  resultBtns.classList.remove('show');resultBtns.style.display='none';
  resumeBtn.style.display='block';
  errSummary.textContent=customMsg||(st.errors.length?st.errors.length+' word(s) with mistakes — review below, then resume.':'No mistakes so far — nice going!');
  errList.innerHTML=st.errors.length?st.errors.map(e=>'<span class="echip" data-i="'+e.idx+'"><b>'+esc(e.expected)+'</b>→'+esc(e.typed||'—')+'</span>').join(''):'<span class="muted2">Nothing to fix yet.</span>';
  errPanel.classList.add('open');errBackdrop.classList.add('open');
}
function showResults(wpm,acc,errCount,timeStr,grossWpm,fullMistakes,halfMistakes,timeExpired){
  const st=computeStats(),isWord=mode.value==='word-normal'||mode.value==='word-shift';
  errTitle.textContent=timeExpired?"TIME'S UP":(isWord?'WORD PRACTICE — RESULTS':'PASSAGE COMPLETE');
  errSummary.textContent=isWord?'You finished '+(st.wordsTotal||0)+' word(s) — '+(st.wordsCorrect||0)+' correct.':(timeExpired?"Time limit reached — here's how you did.":'Great job finishing the passage!');
  resultStats.style.display='grid';resultStats.classList.add('show');
  const boxes=[['⏱ '+timeStr,'TIME'],['⚡ '+wpm,grossWpm!==undefined?'NET WPM':'WPM']];
  if(grossWpm!==undefined)boxes.push(['🚀 '+grossWpm,'GROSS WPM']);
  boxes.push(['✅ '+acc+'%','ACCURACY']);
  if(fullMistakes!==undefined){boxes.push(['❌ '+fullMistakes,'FULL MISTAKES']);boxes.push(['⚠ '+halfMistakes,'HALF MISTAKES']);}
  else boxes.push(['❌ '+errCount,'ERRORS']);
  resultStats.innerHTML=boxes.map(s=>'<div class="statbox"><div class="v">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>').join('');
  errList.innerHTML=st.errors.length?st.errors.map(e=>'<span class="echip"><b>'+esc(e.expected)+'</b>→'+esc(e.typed||'—')+'</span>').join(''):'<span class="muted2">No mistakes — perfect run!</span>';
  if(isWord){
    resumeBtn.style.display='none';
    resultBtns.style.display='flex';resultBtns.classList.add('show');
  }else{
    resumeBtn.style.display='block';resumeBtn.textContent='Close';
    resultBtns.classList.remove('show');resultBtns.style.display='none';
  }
  errPanel.classList.add('open');errBackdrop.classList.add('open');
}
function hideErrorPanel(){errPanel.classList.remove('open');errBackdrop.classList.remove('open');resumeBtn.textContent='Resume Typing'}
function pauseTest(){
  if(paused||!start||finished)return;
  paused=true;pauseStart=performance.now();
  clearTimeout(idleTimer);
  pauseBtn.textContent='Resume';
  showErrorPanel();
}
function resumeTest(){
  if(finished){hideErrorPanel();return}
  if(!paused)return;
  pausedTotal+=performance.now()-pauseStart;
  paused=false;pauseBtn.textContent='Pause';
  hideErrorPanel();resetIdle();doc.focus();
}
mode.onchange=()=>{if(mode.value==='word-normal'||mode.value==='word-shift')generateWordPassage();resetTest();render()};
layout.onchange=render;
wordCount.oninput=()=>{wordCountVal.textContent=wordCount.value};
wordCount.onchange=()=>{generateWordPassage();resetTest();render()};
shuffleBtn.onclick=()=>{generateWordPassage();resetTest();render();doc.focus()};
retryBtn.onclick=()=>{resetTest();render();doc.focus()};
newWordsBtn.onclick=()=>{generateWordPassage();resetTest();render();doc.focus()};
timeLimit.onchange=()=>{timeLimitMs=+timeLimit.value;resetTest();render()};
examMode.onchange=()=>{examBadge.style.display=examMode.checked?'':'none'};
generateWordPassage();render();resetTest();
document.getElementById('settingsBtn').onclick=()=>document.getElementById('settings').classList.toggle('open');
document.getElementById('clearBtn').onclick=()=>{resetTest();doc.focus()};
pauseBtn.onclick=()=>{if(finished)return;paused?resumeTest():pauseTest()};
resumeBtn.onclick=resumeTest;
errBackdrop.onclick=resumeTest;
errList.addEventListener('click',e=>{const c=e.target.closest('.echip');if(!c)return;if(!finished)resumeTest();doc.focus()});
function flashLocked(){
  const tb=document.querySelector('.typebox');
  tb.classList.add('locked-flash');
  setTimeout(()=>tb.classList.remove('locked-flash'),150);
}
doc.addEventListener('keydown',e=>{
  if(paused)return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const nonFree=mode.value!=='free';
  if(e.code==='Backspace'){
    e.preventDefault();
    // Many real Hindi typing exams (CPCT etc.) disable backspace entirely, so mistakes
    // count as raw errors without correction — Exam Mode simulates that constraint.
    if(examMode.checked){flashLocked();return}
    if(pendingI){pendingI=false}
    else{
      // Remove one user-visible grapheme, not one UTF-16 code unit. This keeps
      // Devanagari conjuncts/matras from being split into corrupt fragments.
      const gs=graphemes(buffer);gs.pop();buffer=gs.join('');
    }
  }
  else if(nonFree&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();if(!start)start=performance.now();finalizeWord()}
  else if(e.code==='Enter'){e.preventDefault();pendingI=false;buffer+='\n'}
  else if(KEYMAP[e.code]){e.preventDefault();if(!start)start=performance.now();press(e.code,e.shiftKey)}
  else return;
  if(nonFree){
    const shown=completedWords.map(w=>w.typed).join(' ')+(completedWords.length?' ':'')+buffer;
    doc.value=shown;doc.setSelectionRange(shown.length,shown.length);
  }else{
    doc.value=buffer;doc.setSelectionRange(buffer.length,buffer.length);
  }
  renderPassage();resetIdle();
  checkFinish();
});
doc.addEventListener('paste',e=>{e.preventDefault();});
doc.addEventListener('input',()=>{ 
  // keydown owns the model; reset any browser/IME insertion that slipped through.
  const shown=mode.value!=='free'
    ?completedWords.map(w=>w.typed).join(' ')+(completedWords.length?' ':'')+buffer
    :buffer;
  if(doc.value!==shown){doc.value=shown;doc.setSelectionRange(shown.length,shown.length);}
});

setInterval(tick,1000);
const rows=[['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal'],['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash'],['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'],['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash']];document.getElementById('kb').innerHTML=rows.map(r=>'<div class=row>'+r.map(c=>'<span class="key" data-code="'+c+'">'+KEYMAP[c].n+'<b>'+KEYMAP[c].s+'</b></span>').join('')+'</div>').join('');document.getElementById('kbOn').onchange=e=>document.getElementById('kb').classList.toggle('open',e.target.checked);
</script></body></html>
