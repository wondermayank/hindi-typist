r(--muted);letter-spacing:.06em}#resultBtns.show,#resultStats.show{display:flex}#resultStats.show{display:grid}</style></head><body><header class="top"><div class="brand">Thunder Typing <i>हिंदी</i></div><div class="controls"><span id="time" class="stat">00:00</span><span id="wpm">0 WPM</span><span id="acc" class="stat">100% acc</span><span id="err" class="stat">0 err</span><button class="btn" id="pauseBtn">Pause</button><button class="btn" id="settingsBtn">Settings</button><button class="btn" id="clearBtn">Clear</button></div></header>

<script>
const KEYMAP={Backquote:{n:'़',s:'द्य'},Digit1:{n:'१',s:'।'},Digit2:{n:'२',s:'/'},Digit3:{n:'३',s:':'},Digit4:{n:'४',s:'?'},Digit5:{n:'५',s:'-'},Digit6:{n:'६',s:'‘'},Digit7:{n:'७',s:'’'},Digit8:{n:'८',s:'द्व'},Digit9:{n:'९',s:'त्र'},Digit0:{n:'०',s:'ऋ'},Minus:{n:'·',s:'्'},Equal:{n:'ृ',s:'ॄ'},KeyQ:{n:'ु',s:'फ'},KeyW:{n:'ू',s:'ॅ'},KeyE:{n:'म',s:'म्'},KeyR:{n:'त',s:'त्'},KeyT:{n:'ज',s:'ज्'},KeyY:{n:'ल',s:'ल्'},KeyU:{n:'न',s:'न्'},KeyI:{n:'प',s:'प्'},KeyO:{n:'व',s:'व्'},KeyP:{n:'च',s:'च्'},BracketLeft:{n:'ख्',s:'क्ष्'},BracketRight:{n:',',s:'ौ'},Backslash:{n:'ो',s:'द्ध'},KeyA:{n:'ं',s:'ॉ'},KeyS:{n:'े',s:'ै'},KeyD:{n:'क',s:'क्'},KeyF:{n:'ि',s:'थ्'},KeyG:{n:'ह',s:'ळ'},KeyH:{n:'ी',s:'भ्'},KeyJ:{n:'र',s:'श्र'},KeyK:{n:'ा',s:'ज्ञ'},KeyL:{n:'स',s:'स्'},Semicolon:{n:'य',s:'रू'},Quote:{n:'श्',s:'ष्'},KeyZ:{n:'्र',s:'र्'},KeyX:{n:'ग',s:'ग्'},KeyC:{n:'ब',s:'ब्'},KeyV:{n:'अ',s:'ट'},KeyB:{n:'इ',s:'ठ'},KeyN:{n:'द',s:'छ'},KeyM:{n:'उ',s:'ड'},Comma:{n:'ए',s:'ढ'},Period:{n:'ण्',s:'झ'},Slash:{n:'ध्',s:'घ'},Space:{n:' ',s:' '}};
const HALF={'म्':'म','त्':'त','ज्':'ज','ल्':'ल','न्':'न','प्':'प','व्':'व','च्':'च','छ्':'छ','क्':'क','ग्':'ग','ब्':'ब','र्':'र','स्':'स','श्':'श','ष्':'ष','भ्':'भ','थ्':'थ','ख्':'ख','ण्':'ण','ध्':'ध','क्ष्':'क्ष'};const MAT=new Set(['ी','ृ','ॉ','ॅ','ॊ','ॆ','ा','ॄ','ः','ो','ौ','े','ै','ु','ू']);const FULL={'अा':'आ','अि':'इ','अी':'ई','अु':'उ','अू':'ऊ','अे':'ए','अै':'ऐ','अो':'ओ','अौ':'औ'};const IV=new Set(['अ','आ','इ','ई','उ','ऊ','ए','ऐ','ओ','औ','ऋ']);let buffer='',pendingI=false,start=0;
function graphemes(str){
  if(!str)return[];
  try{if(typeof Intl!=='undefined'&&Intl.Segmenter){return[...new Intl.Segmenter('hi',{granularity:'grapheme'}).segment(str)].map(s=>s.segment)}}catch(e){}
  const combining=/[\u0900-\u0903\u093a-\u094f\u0951-\u0957\u0962\u0963]/;
  const out=[];let i=0;
  while(i<str.length){let g=str[i];i++;while(i<str.length&&combining.test(str[i])){g+=str[i];i++}out.push(g)}
  return out;
}
function clusterize(word){
  const g=graphemes(word);let idx=0;const out=[];
  for(const seg of g){out.push({text:seg,start:idx,end:idx+seg.length});idx+=seg.length}
  return out;
}
function press(code,shift){let ch=(KEYMAP[code]||{})[shift?'s':'n'];if(ch===undefined)return;if(ch==='ि'){pendingI=true;return}if(pendingI){buffer+=(HALF[ch]||ch)+'ि';pendingI=false;return}if(MAT.has(ch)||ch===':'){let prev=buffer.slice(-1),combo=prev+ch;if(FULL[combo]){buffer=buffer.slice(0,-1)+FULL[combo];return}for(const h in HALF)if(buffer.endsWith(h)){buffer=buffer.slice(0,-h.length)+HALF[h];break}buffer+=ch;return}buffer+=ch}
const PASS={"normal-easy": "एक नगर में राजा रहा। राजा बहुत दयालु एवं वीर था। एक समय शत्रु ने नगर पर वार किया। राजा ने अपनी सेना बुलाई। सब जन युद्ध पर गए। राजा ने साहस से वार किया और शत्रु दल को हरा दिया। युद्ध के बाद नगर में शांति आई। सब लोग बहुत खुश हुए। राजा ने सब जन को मान दिया। नदी के तट पर मेला लगा। लोग उपवन में गए। वहाँ कमल के फूल खिले। पवन शीतल बही। सब जन ने मिलकर राजा का जयकार किया। राजा ने भी सबको अपना आशीष दिया। इस तरह पूरा नगर सुख और चैन से रहने लगा।", "normal-hard": "प्राचीन समय में एक प्रतापी नृप रहा। उसका नाम जयपाल था। वह परम वीर, दयालु एवं नीति-निपुण नरपति था। एक दिन दुष्ट शत्रु दल ने अचानक नगर सीमा पर भीषण वार किया। तब प्रतापी राजा ने अपनी विशाल चतुरंगिणी सेना को रणभूमि में उतरने की आज्ञा दी। शूरवीर सैनिक शस्त्र लेकर युद्ध में कूद पड़े। भीषण रण हुआ। बाणों की वर्षा हुई। राजा ने अद्भुत पराक्रम दिखाया और शत्रु दल का मान मर्दन कर दिया। अंत में राजा ने पूर्ण विजय पायी। विजय के उपरांत नगर में अपार हर्ष छा गया। सब जन ने राजा का जयघोष किया। पावन नदी के तट पर स्थित उपवन में विशाल उत्सव रखा गया। वहाँ रंग-बिरंगे कमल खिले थे और सुगंधित शीतल पवन बह रही थी। विद्वानों ने प्रभु का ध्यान किया। जन-जन के प्राण में नया उल्लास और नया जोश भर गया। राजा ने समस्त प्रजा को अभयदान दिया। इस प्रकार धर्म और न्याय की स्थापना से सम्पूर्ण राज्य में सुख, शांति और समृद्धि का विस्तार हुआ।", "shift-easy": "ऋषि-मुनियों द्वारा प्रतिपादित ज्ञान तथा अध्यात्म की श्रेष्ठ परंपरा हमारे समाज को सदैव सही दिशा देती रही है। इस पावन भूमि पर अनेक शूरवीरों, विद्वानों और तपस्वियों ने त्याग, निष्ठा तथा सत्य की रक्षा हेतु अपना सर्वस्व समर्पित किया। मानव जीवन में विद्या, धैर्य और क्षमा का अद्भुत महत्व है। कठिन परिस्थितियों के बीच भी दृढ़ संकल्प और अदम्य साहस से व्यक्ति बड़े से बड़े लक्ष्य को प्राप्त कर सकता है। समय का सदुपयोग, निरंतर परिश्रम तथा कर्तव्यपरायणता ही प्रत्येक कार्य में सफलता के मूलमंत्र हैं। समाज में परस्पर प्रेम, बंधुत्व, दया तथा सहयोग की भावना ही देश को उन्नति के उच्च शिखर तक पहुंचाती है।", "shift-hard": "प्राचीन काल से ही हमारे राष्ट्र में ज्ञान-विज्ञान, कला, साहित्य और दर्शन का अद्वितीय विकास हुआ है। ऋग्वेद जैसे प्राचीन ग्रंथों से लेकर आधुनिक युग तक भारतीय मेधा ने संपूर्ण विश्व को ज्ञान का नया आलोक प्रदान किया। किसी भी सभ्य समाज की आधारशिला उसके नागरिकों के नैतिक आचरण, दृढ़ चरित्र, श्रम और सत्यनिष्ठा पर निर्भर करती है। आज के तकनीकी युग में भी प्राचीन संस्कारों, शुद्ध चिंतन और मानवीय दृष्टिकोण का महत्व कम नहीं हुआ है। मनुष्य जब कठिन मार्ग पर चलते हुए धैर्य खोए बिना निरंतर अभ्यास करता है, तब असंभव प्रतीत होने वाले कार्य भी सहज बन जाते हैं। शिक्षा का वास्तविक उद्देश्य केवल पुस्तकीय ज्ञान अर्जित करना नहीं, अपितु व्यक्ति के विवेक, संयम और बौद्धिक क्षमता का सर्वांगीण विकास करना है। समाज के सभी वर्गों के उत्थान, पर्यावरण के संरक्षण, जल संचयन तथा सामाजिक समरसता की स्थापना में प्रत्येक नागरिक की सक्रिय सहभागिता अनिवार्य है। जब हम अपने अधिकारों के साथ-साथ राष्ट्रीय कर्तव्यों का निष्ठापूर्वक पालन करेंगे, तभी राष्ट्र सशक्त, समृद्ध और आत्मनिर्भर बन सकेगा।"};
const WORDS_NORMAL=["कमल","जल","राजा","सूरज","पुस्तक","देश","भारत","गगन","पवन","चमन","नगर","जीवन","सुंदर","संगीत","मंत्र","यंत्र","एकता","इतिहास","उदय","अमर","कलम","हंस","रंग","गुलाब","चोर","योग","दवा","सुख","दुख","नाम","काम","रात","दिन","पानी","घर","समय","बात","लोग","फल","मन","रूप","कृपा","कौशल","पैसा","मित्र"];
const WORDS_SHIFT=["ध्यान","मुख्य","श्याम","ख्याल","पुण्य","सत्य","जन्म","स्थान","ज्ञान","मित्र","श्रम","क्षमा","द्वार","बुद्धि","धर्म","प्रकट","प्रेम","पुष्प","निश्चय","सप्ताह","ख्याति","अरण्य","लावण्य","ध्येय","श्लोक","पुण्य","संगीत","कृपा","कौशल","डॉक्टर","रूप","ऋषि","सुंदर","इतिहास","गणेश"];
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let currentWordPassage='';
function generateWordPassage(){
  const n=+wordCount.value,list=mode.value==='word-shift'?WORDS_SHIFT:WORDS_NORMAL;
  const picked=[];while(picked.length<n)picked.push(...shuffleArr(list));
  currentWordPassage=picked.slice(0,n).join(' ');
}
const doc=document.getElementById('doc'),mode=document.getElementById('mode'),layout=document.getElementById('layout'),practice=document.getElementById('practice'),wordRow=document.getElementById('wordRow'),wordCount=document.getElementById('wordCount'),wordCountVal=document.getElementById('wordCountVal'),shuffleBtn=document.getElementById('shuffleBtn');
const wpmEl=document.getElementById('wpm'),accEl=document.getElementById('acc'),errEl=document.getElementById('err'),timeEl=document.getElementById('time'),pauseBtn=document.getElementById('pauseBtn'),errPanel=document.getElementById('errPanel'),errBackdrop=document.getElementById('errBackdrop'),errList=document.getElementById('errList'),errSummary=document.getElementById('errSummary'),resumeBtn=document.getElementById('resumeBtn'),passageEl=document.getElementById('passage');
let paused=false,pausedTotal=0,pauseStart=0,idleTimer=null,finished=false;
let wordIndex=0,completedWords=[];
const IDLE_MS=6000;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function passageText(){return(mode.value==='word-normal'||mode.value==='word-shift')?currentWordPassage:(PASS[mode.value]||'')}
function passageWords(){const p=passageText();return p?p.split(' '):[]}
function renderPassage(){
  const p=passageText();
  if(mode.value==='free'){passageEl.textContent='';updateKbHighlight('');return}
  const words=passageWords();
  let out='';
  for(let w=0;w<words.length;w++){
    const word=words[w];
    if(w<wordIndex){
      const rec=completedWords[w];
      out+='<span class="'+(rec&&rec.correct?'ok':'bad')+'">'+esc(word)+'</span>';
    }else if(w===wordIndex){
      const clusters=clusterize(word);
      let wOut='';
      for(const c of clusters){
        let cls;
        if(c.end<=buffer.length)cls=buffer.slice(c.start,c.end)===c.text?'ok':'bad';
        else if(c.start<=buffer.length)cls='cur';
        else cls='pending';
        wOut+='<span class="'+cls+'">'+esc(c.text)+'</span>';
      }
      if(buffer.length>word.length){
        clusterize(buffer.slice(word.length)).forEach(c=>{wOut+='<span class="bad">'+esc(c.text)+'</span>'});
      }
      out+=wOut;
    }else if(w===wordIndex+1){
      out+='<span class="next-word-char">'+esc(word)+'</span>';
    }else{
      out+='<span class="pending">'+esc(word)+'</span>';
    }
    if(w<words.length-1)out+=' ';
  }
  passageEl.innerHTML=out;
  updateKbHighlight(words[wordIndex]||'');
}
function finalizeWord(){
  const words=passageWords();
  if(wordIndex>=words.length)return;
  const target=words[wordIndex];
  completedWords.push({target:target,typed:buffer,correct:buffer===target});
  buffer='';pendingI=false;wordIndex++;
}
function checkFinish(){
  const words=passageWords();
  if(mode.value!=='free'&&words.length&&wordIndex>=words.length&&!finished){
    finished=true;paused=true;clearTimeout(idleTimer);
    const st=computeStats(),elapsed=performance.now()-start-pausedTotal,mins=elapsed/60000;
    const wpm=Math.round((st.correct/5)/Math.max(mins,0.001)),acc=st.total?Math.round(st.correct/st.total*100):100;
    wpmEl.textContent=wpm+' WPM';accEl.textContent=acc+'% acc';errEl.textContent=st.incorrect+' err';
    pauseBtn.textContent='Pause';
    showResults(wpm,acc,st.incorrect,fmtTime(elapsed));
  }
}
function mark(code,cls){const el=document.querySelector('#kb .key[data-code="'+code+'"]');if(el)el.classList.add(cls)}
function findDirect(ch){
  for(const code in KEYMAP)if(KEYMAP[code].n===ch)return{code,cls:'active'};
  for(const code in KEYMAP)if(KEYMAP[code].s===ch)return{code,cls:'active-shift'};
  return null;
}
function highlightChar(ch){const f=findDirect(ch);if(f){mark(f.code,f.cls);return true}return false}
function updateKbHighlight(p){
  document.querySelectorAll('#kb .key.active,#kb .key.active-shift').forEach(k=>k.classList.remove('active','active-shift'));
  if(!p||mode.value==='free')return;
  // Mid-combo: user already pressed अ as the first half of an आ/ई/ऊ/ऐ/औ/ओ/ऋ-style combo — highlight the matra key that completes it.
  if(buffer.length>0&&buffer[buffer.length-1]==='अ'&&p[buffer.length-1]&&p[buffer.length-1]!=='अ'){
    const target=p[buffer.length-1];
    for(const combo in FULL){if(FULL[combo]===target&&combo[0]==='अ'){if(highlightChar(combo[1]))return}}
  }
  // ि (short-i matra) is typed BEFORE its consonant on this layout, so while waiting to complete it,
  // keep highlighting the consonant that finishes the combo (matches existing press() behaviour).
  if(pendingI){highlightChar(p[buffer.length]);return}
  const nc=p[buffer.length];
  if(nc===undefined)return;
  // If the very next character in the passage is ि, the correct next physical key is the ि key itself
  // (pressed first), not the consonant that visually precedes it in the text.
  if(p[buffer.length+1]==='ि'){highlightChar('ि');return}
  if(highlightChar(nc))return;
  // Combo-only vowels (आ, ई, ऊ, ऐ, ओ, औ) aren't a direct key — the first real keystroke is अ.
  for(const combo in FULL){if(FULL[combo]===nc&&combo[0]==='अ'){highlightChar('अ');return}}
}
function render(){
  practice.className='practice layout-'+layout.value+(mode.value==='free'?' free':'');
  doc.placeholder=mode.value==='free'?'Free typing — start here…':'Type the passage here…';
  const passOnly=mode.value!=='free';
  accEl.style.display=passOnly?'':'none';
  errEl.style.display=passOnly?'':'none';
  wordRow.style.display=(mode.value==='word-normal'||mode.value==='word-shift')?'block':'none';
  renderPassage();
}
function computeStats(){
  const isFree=mode.value==='free';
  if(isFree)return{correct:0,incorrect:0,errors:[],isFree:true,total:0};
  let correct=0,incorrect=0,errors=[];
  completedWords.forEach((w,idx)=>{
    const tG=graphemes(w.target),yG=graphemes(w.typed);
    if(w.correct){correct+=tG.length;return}
    let c=0;const len=Math.min(tG.length,yG.length);
    for(let i=0;i<len;i++)if(tG[i]===yG[i])c++;
    correct+=c;incorrect+=Math.max(tG.length,yG.length)-c;
    errors.push({idx:idx,expected:w.target,typed:w.typed});
  });
  // Include the word currently being typed (not yet submitted with Space) so WPM/accuracy
  // update live instead of only jumping once a word is finished.
  const curTarget=passageWords()[wordIndex];
  if(curTarget!==undefined&&buffer.length>0){
    const tG=graphemes(curTarget),yG=graphemes(buffer);
    const len=Math.min(tG.length,yG.length);let c=0;
    for(let i=0;i<len;i++)if(tG[i]===yG[i])c++;
    correct+=c;incorrect+=Math.max(tG.length,yG.length)-c;
  }
  return{correct:correct,incorrect:incorrect,errors:errors,isFree:false,total:correct+incorrect,wordsTotal:completedWords.length,wordsCorrect:completedWords.filter(w=>w.correct).length}
}
function fmtTime(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){
  if(!start||paused)return;
  const elapsed=performance.now()-start-pausedTotal,mins=elapsed/60000;
  timeEl.textContent=fmtTime(elapsed);
  if(mins<=0)return;
  const st=computeStats();
  let wpm;
  if(st.isFree){
    const words=buffer.trim().split(/\s+/).filter(Boolean).length;
    wpm=Math.round(words/mins);
  }else{
    wpm=Math.round((st.correct/5)/mins);
    const acc=st.total?Math.round(st.correct/st.total*100):100;
    accEl.textContent=acc+'% acc';
    errEl.textContent=st.incorrect+' err';
  }
  wpmEl.textContent=wpm+' WPM';
}
function resetTest(){
  buffer='';pendingI=false;start=0;pausedTotal=0;paused=false;finished=false;
  wordIndex=0;completedWords=[];
  clearTimeout(idleTimer);
  doc.value='';wpmEl.textContent='0 WPM';accEl.textContent='100% acc';errEl.textContent='0 err';timeEl.textContent='00:00';
  pauseBtn.textContent='Pause';
  hideErrorPanel();
  renderPassage();
}
function resetIdle(){
  clearTimeout(idleTimer);
  if(mode.value==='free')return;
  idleTimer=setTimeout(()=>{if(start&&!paused&&!finished&&(buffer.length>0||wordIndex>0))pauseTest()},IDLE_MS);
}
const errTitle=document.getElementById('errTitle'),resultStats=document.getElementById('resultStats'),resultBtns=document.getElementById('resultBtns'),retryBtn=document.getElementById('retryBtn'),newWordsBtn=document.getElementById('newWordsBtn');
function showErrorPanel(customMsg){
  const st=computeStats();
  errTitle.textContent='MISTAKE REVIEW';
  resultStats.classList.remove('show');resultStats.style.display='none';
  resultBtns.classList.remove('show');resultBtns.style.display='none';
  resumeBtn.style.display='block';
  errSummary.textContent=customMsg||(st.errors.length?st.errors.length+' word(s) with mistakes — review below, then resume.':'No mistakes so far — nice going!');
  errList.innerHTML=st.errors.length?st.errors.map(e=>'<span class="echip" data-i="'+e.idx+'"><b>'+esc(e.expected)+'</b>→'+esc(e.typed||'—')+'</span>').join(''):'<span class="muted2">Nothing to fix yet.</span>';
  errPanel.classList.add('open');errBackdrop.classList.add('open');
}
function showResults(wpm,acc,errCount,timeStr){
  const st=computeStats(),isWord=mode.value==='word-normal'||mode.value==='word-shift';
  errTitle.textContent=isWord?'WORD PRACTICE — RESULTS':'PASSAGE COMPLETE';
  errSummary.textContent=isWord?'You finished '+(st.wordsTotal||0)+' word(s) — '+(st.wordsCorrect||0)+' correct.':'Great job finishing the passage!';
  resultStats.style.display='grid';resultStats.classList.add('show');
  resultStats.innerHTML=[
    ['⏱ '+timeStr,'TIME'],
    ['⚡ '+wpm,'WPM'],
    ['✅ '+acc+'%','ACCURACY'],
    ['❌ '+errCount,'ERRORS']
  ].map(s=>'<div class="statbox"><div class="v">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>').join('');
  errList.innerHTML=st.errors.length?st.errors.map(e=>'<span class="echip"><b>'+esc(e.expected)+'</b>→'+esc(e.typed||'—')+'</span>').join(''):'<span class="muted2">No mistakes — perfect run!</span>';
  if(isWord){
    resumeBtn.style.display='none';
    resultBtns.style.display='flex';resultBtns.classList.add('show');
  }else{
    resumeBtn.style.display='block';resumeBtn.textContent='Close';
    resultBtns.classList.remove('show');resultBtns.style.display='none';
  }
  errPanel.classList.add('open');errBackdrop.classList.add('open');
}
function hideErrorPanel(){errPanel.classList.remove('open');errBackdrop.classList.remove('open');resumeBtn.textContent='Resume Typing'}
function pauseTest(){
  if(paused||!start||finished)return;
  paused=true;pauseStart=performance.now();
  clearTimeout(idleTimer);
  pauseBtn.textContent='Resume';
  showErrorPanel();
}
function resumeTest(){
  if(finished){hideErrorPanel();return}
  if(!paused)return;
  pausedTotal+=performance.now()-pauseStart;
  paused=false;pauseBtn.textContent='Pause';
  hideErrorPanel();resetIdle();doc.focus();
}
mode.onchange=()=>{if(mode.value==='word-normal'||mode.value==='word-shift')generateWordPassage();resetTest();render()};
layout.onchange=render;
wordCount.oninput=()=>{wordCountVal.textContent=wordCount.value};
wordCount.onchange=()=>{generateWordPassage();resetTest();render()};
shuffleBtn.onclick=()=>{generateWordPassage();resetTest();render();doc.focus()};
retryBtn.onclick=()=>{resetTest();render();doc.focus()};
newWordsBtn.onclick=()=>{generateWordPassage();resetTest();render();doc.focus()};
generateWordPassage();render();resetTest();
document.getElementById('settingsBtn').onclick=()=>document.getElementById('settings').classList.toggle('open');
document.getElementById('clearBtn').onclick=()=>{resetTest();doc.focus()};
pauseBtn.onclick=()=>{if(finished)return;paused?resumeTest():pauseTest()};
resumeBtn.onclick=resumeTest;
errBackdrop.onclick=resumeTest;
errList.addEventListener('click',e=>{const c=e.target.closest('.echip');if(!c)return;if(!finished)resumeTest();doc.focus()});
doc.addEventListener('keydown',e=>{
  if(paused)return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const nonFree=mode.value!=='free';
  if(e.code==='Backspace'){e.preventDefault();if(pendingI)pendingI=false;else buffer=buffer.slice(0,-1)}
  else if(nonFree&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();if(!start)start=performance.now();finalizeWord()}
  else if(e.code==='Enter'){e.preventDefault();pendingI=false;buffer+='\n'}
  else if(KEYMAP[e.code]){e.preventDefault();if(!start)start=performance.now();press(e.code,e.shiftKey)}
  else return;
  if(nonFree){
    const shown=completedWords.map(w=>w.typed).join(' ')+(completedWords.length?' ':'')+buffer;
    doc.value=shown;doc.setSelectionRange(shown.length,shown.length);
  }else{
    doc.value=buffer;doc.setSelectionRange(buffer.length,buffer.length);
  }
  renderPassage();resetIdle();
  checkFinish();
});
setInterval(tick,1000);
const rows=[['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal'],['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash'],['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'],['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash']];document.getElementById('kb').innerHTML=rows.map(r=>'<div class=row>'+r.map(c=>'<span class="key" data-code="'+c+'">'+KEYMAP[c].n+'<b>'+KEYMAP[c].s+'</b></span>').join('')+'</div>').join('');document.getElementById('kbOn').onchange=e=>document.getElementById('kb').classList.toggle('open',e.target.checked);
</script></body></html>
