<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thunder Typing</title><style>
:root{--p:#6699fb;--ink:#182033;--muted:#687087;--line:#e5e9f2}*{box-sizing:border-box}body{margin:0;background:#f7f9fd;color:var(--ink);font-family:Inter,system-ui,sans-serif}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.brand{font-weight:800}.brand i{font-style:normal;color:var(--p)}button,select{font:inherit}.controls{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn:hover{border-color:var(--p);color:var(--p)}#wpm{font-weight:800;color:var(--p);padding:8px 10px}.settings{position:fixed;right:20px;top:70px;width:300px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 18px 50px #0002;display:none;z-index:10}.settings.open{display:block}.settings label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}.settings select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.settings .check{display:flex;gap:8px;align-items:center;margin-top:16px}.practice{height:calc(100vh - 62px);padding:18px;display:grid;gap:14px}.left,.right{min-width:0}.layout-left,.layout-right{grid-template-columns:1fr 1fr}.layout-right .passage{order:2}.layout-top,.layout-bottom{grid-template-rows:1fr 1fr}.layout-bottom .passage{order:2}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;overflow:auto}.label{font-size:11px;font-weight:900;letter-spacing:.13em;color:var(--muted);margin-bottom:12px}.passage-text{font-family:'Noto Sans Devanagari','Nirmala UI',sans-serif;font-size:23px;line-height:2;white-space:pre-wrap}.typebox textarea{width:100%;height:calc(100% - 30px);border:0;outline:0;resize:none;background:transparent;font-family:'Noto Sans Devanagari','Nirmala UI',sans-serif;font-size:23px;line-height:2}.free .passage{display:none}.free{display:block}.free .typebox{height:100%}.kb{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:none;max-width:95vw;z-index:4}.kb.open{display:block}.row{display:flex;gap:3px;margin:3px}.key{min-width:30px;padding:6px;text-align:center;border:1px solid var(--line);border-radius:5px;font-size:12px}.key b{display:block;color:var(--p)}@media(max-width:700px){.layout-left,.layout-right{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.practice{padding:10px}.passage-text,.typebox textarea{font-size:19px}.top{padding:0 10px}.settings{right:10px;width:calc(100% - 20px)}}
</style></head><body><header class="top"><div class="brand">Thunder Typing <i>हिंदी</i></div><div class="controls"><span id="wpm">0 WPM</span><button class="btn" id="settingsBtn">Settings</button><button class="btn" id="clearBtn">Clear</button></div></header>
<div class="settings" id="settings"><label>Passage</label><select id="mode"><option value="free">Free typing</option><option value="normal-easy">No Shift · Easy</option><option value="normal-hard">No Shift · Hard</option><option value="shift-easy">Shift + Normal · Easy</option><option value="shift-hard">Shift + Normal · Hard</option></select><label>Position</label><select id="layout"><option value="left">Passage left / typing right</option><option value="right">Typing left / passage right</option><option value="top">Passage top / typing bottom</option><option value="bottom">Typing top / passage bottom</option></select><label class="check"><input type="checkbox" id="kbOn"> Open keyboard helper</label></div>
<main class="practice layout-left" id="practice"><section class="card passage"><div class="label">PASSAGE</div><div class="passage-text" id="passage"></div></section><section class="card typebox"><div class="label">YOUR TYPING</div><textarea id="doc" autofocus spellcheck="false" placeholder="Free typing — start here…"></textarea></section></main><div class="kb" id="kb"></div>
<script>
const KEYMAP={Backquote:{n:'़',s:'द्य'},Digit1:{n:'१',s:'।'},Digit2:{n:'२',s:'/'},Digit3:{n:'३',s:':'},Digit4:{n:'४',s:'?'},Digit5:{n:'५',s:'-'},Digit6:{n:'६',s:'‘'},Digit7:{n:'७',s:'’'},Digit8:{n:'८',s:'द्व'},Digit9:{n:'९',s:'त्र'},Digit0:{n:'०',s:'ऋ'},Minus:{n:'·',s:'्'},Equal:{n:'ृ',s:'ॄ'},KeyQ:{n:'ु',s:'फ'},KeyW:{n:'ू',s:'ॅ'},KeyE:{n:'म',s:'म्'},KeyR:{n:'त',s:'त्'},KeyT:{n:'ज',s:'ज्'},KeyY:{n:'ल',s:'ल्'},KeyU:{n:'न',s:'न्'},KeyI:{n:'प',s:'प्'},KeyO:{n:'व',s:'व्'},KeyP:{n:'च',s:'च्'},BracketLeft:{n:'ख्',s:'क्ष्'},BracketRight:{n:',',s:'ौ'},Backslash:{n:'ो',s:'द्ध'},KeyA:{n:'ं',s:'ॉ'},KeyS:{n:'े',s:'ै'},KeyD:{n:'क',s:'क्'},KeyF:{n:'ि',s:'थ्'},KeyG:{n:'ह',s:'ळ'},KeyH:{n:'ी',s:'भ्'},KeyJ:{n:'र',s:'श्र'},KeyK:{n:'ा',s:'ज्ञ'},KeyL:{n:'स',s:'स्'},Semicolon:{n:'य',s:'रू'},Quote:{n:'श्',s:'ष्'},KeyZ:{n:'्र',s:'र्'},KeyX:{n:'ग',s:'ग्'},KeyC:{n:'ब',s:'ब्'},KeyV:{n:'अ',s:'ट'},KeyB:{n:'इ',s:'ठ'},KeyN:{n:'द',s:'छ'},KeyM:{n:'उ',s:'ड'},Comma:{n:'ए',s:'ढ'},Period:{n:'ण्',s:'झ'},Slash:{n:'ध्',s:'घ'},Space:{n:' ',s:' '}};
const HALF={'म्':'म','त्':'त','ज्':'ज','ल्':'ल','न्':'न','प्':'प','व्':'व','च्':'च','छ्':'छ','क्':'क','ग्':'ग','ब्':'ब','र्':'र','स्':'स','श्':'श','ष्':'ष','भ्':'भ','थ्':'थ','ख्':'ख','ण्':'ण','ध्':'ध','क्ष्':'क्ष'};const MAT=new Set(['ी','ृ','ॉ','ॅ','ॊ','ॆ','ा','ॄ','ः','ो','ौ','े','ै','ु','ू']);const FULL={'अा':'आ','अि':'इ','अी':'ई','अु':'उ','अू':'ऊ','अे':'ए','अै':'ऐ','अो':'ओ','अौ':'औ'};const IV=new Set(['अ','आ','इ','ई','उ','ऊ','ए','ऐ','ओ','औ','ऋ']);let buffer='',pendingI=false,start=0;
function press(code,shift){let ch=(KEYMAP[code]||{})[shift?'s':'n'];if(ch===undefined)return;if(ch==='ि'){pendingI=true;return}if(pendingI){buffer+=(HALF[ch]||ch)+'ि';pendingI=false;return}if(MAT.has(ch)||ch===':'){let prev=buffer.slice(-1),combo=prev+ch;if(FULL[combo]){buffer=buffer.slice(0,-1)+FULL[combo];return}for(const h in HALF)if(buffer.endsWith(h)){buffer=buffer.slice(0,-h.length)+HALF[h];break}buffer+=ch;return}buffer+=ch}
const PASS={"normal-easy": "एक नगर में राजा रहा। राजा बहुत दयालु एवं वीर था। एक समय शत्रु ने नगर पर वार किया। राजा ने अपनी सेना बुलाई। सब जन युद्ध पर गए। राजा ने साहस से वार किया और शत्रु दल को हरा दिया। युद्ध के बाद नगर में शांति आई। सब लोग बहुत खुश हुए। राजा ने सब जन को मान दिया। नदी के तट पर मेला लगा। लोग उपवन में गए। वहाँ कमल के फूल खिले। पवन शीतल बही। सब जन ने मिलकर राजा का जयकार किया। राजा ने भी सबको अपना आशीष दिया। इस तरह पूरा नगर सुख और चैन से रहने लगा।", "normal-hard": "प्राचीन समय में एक प्रतापी नृप रहा। उसका नाम जयपाल था। वह परम वीर, दयालु एवं नीति-निपुण नरपति था। एक दिन दुष्ट शत्रु दल ने अचानक नगर सीमा पर भीषण वार किया। तब प्रतापी राजा ने अपनी विशाल चतुरंगिणी सेना को रणभूमि में उतरने की आज्ञा दी। शूरवीर सैनिक शस्त्र लेकर युद्ध में कूद पड़े। भीषण रण हुआ। बाणों की वर्षा हुई। राजा ने अद्भुत पराक्रम दिखाया और शत्रु दल का मान मर्दन कर दिया। अंत में राजा ने पूर्ण विजय पायी। विजय के उपरांत नगर में अपार हर्ष छा गया। सब जन ने राजा का जयघोष किया। पावन नदी के तट पर स्थित उपवन में विशाल उत्सव रखा गया। वहाँ रंग-बिरंगे कमल खिले थे और सुगंधित शीतल पवन बह रही थी। विद्वानों ने प्रभु का ध्यान किया। जन-जन के प्राण में नया उल्लास और नया जोश भर गया। राजा ने समस्त प्रजा को अभयदान दिया। इस प्रकार धर्म और न्याय की स्थापना से सम्पूर्ण राज्य में सुख, शांति और समृद्धि का विस्तार हुआ।", "shift-easy": "ऋषि-मुनियों द्वारा प्रतिपादित ज्ञान तथा अध्यात्म की श्रेष्ठ परंपरा हमारे समाज को सदैव सही दिशा देती रही है। इस पावन भूमि पर अनेक शूरवीरों, विद्वानों और तपस्वियों ने त्याग, निष्ठा तथा सत्य की रक्षा हेतु अपना सर्वस्व समर्पित किया। मानव जीवन में विद्या, धैर्य और क्षमा का अद्भुत महत्व है। कठिन परिस्थितियों के बीच भी दृढ़ संकल्प और अदम्य साहस से व्यक्ति बड़े से बड़े लक्ष्य को प्राप्त कर सकता है। समय का सदुपयोग, निरंतर परिश्रम तथा कर्तव्यपरायणता ही प्रत्येक कार्य में सफलता के मूलमंत्र हैं। समाज में परस्पर प्रेम, बंधुत्व, दया तथा सहयोग की भावना ही देश को उन्नति के उच्च शिखर तक पहुंचाती है।", "shift-hard": "प्राचीन काल से ही हमारे राष्ट्र में ज्ञान-विज्ञान, कला, साहित्य और दर्शन का अद्वितीय विकास हुआ है। ऋग्वेद जैसे प्राचीन ग्रंथों से लेकर आधुनिक युग तक भारतीय मेधा ने संपूर्ण विश्व को ज्ञान का नया आलोक प्रदान किया। किसी भी सभ्य समाज की आधारशिला उसके नागरिकों के नैतिक आचरण, दृढ़ चरित्र, श्रम और सत्यनिष्ठा पर निर्भर करती है। आज के तकनीकी युग में भी प्राचीन संस्कारों, शुद्ध चिंतन और मानवीय दृष्टिकोण का महत्व कम नहीं हुआ है। मनुष्य जब कठिन मार्ग पर चलते हुए धैर्य खोए बिना निरंतर अभ्यास करता है, तब असंभव प्रतीत होने वाले कार्य भी सहज बन जाते हैं। शिक्षा का वास्तविक उद्देश्य केवल पुस्तकीय ज्ञान अर्जित करना नहीं, अपितु व्यक्ति के विवेक, संयम और बौद्धिक क्षमता का सर्वांगीण विकास करना है। समाज के सभी वर्गों के उत्थान, पर्यावरण के संरक्षण, जल संचयन तथा सामाजिक समरसता की स्थापना में प्रत्येक नागरिक की सक्रिय सहभागिता अनिवार्य है। जब हम अपने अधिकारों के साथ-साथ राष्ट्रीय कर्तव्यों का निष्ठापूर्वक पालन करेंगे, तभी राष्ट्र सशक्त, समृद्ध और आत्मनिर्भर बन सकेगा।"};
const doc=document.getElementById('doc'),mode=document.getElementById('mode'),layout=document.getElementById('layout'),practice=document.getElementById('practice');function render(){practice.className='practice layout-'+layout.value+(mode.value==='free'?' free':'');document.getElementById('passage').textContent=PASS[mode.value]||'';doc.placeholder=mode.value==='free'?'Free typing — start here…':'Type the passage here…'}function tick(){if(!start)return;let m=(performance.now()-start)/60000,w=buffer.trim().split(/\s+/).filter(Boolean).length;document.getElementById('wpm').textContent=Math.round(w/m)+' WPM'}mode.onchange=layout.onchange=render;setInterval(tick,1000);render();document.getElementById('settingsBtn').onclick=()=>document.getElementById('settings').classList.toggle('open');document.getElementById('clearBtn').onclick=()=>{buffer='';pendingI=false;start=0;doc.value='';document.getElementById('wpm').textContent='0 WPM';doc.focus()};doc.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='Backspace'){e.preventDefault();if(pendingI)pendingI=false;else buffer=buffer.slice(0,-1)}else if(e.code==='Enter'){e.preventDefault();pendingI=false;buffer+='\n'}else if(KEYMAP[e.code]){e.preventDefault();if(!start)start=performance.now();press(e.code,e.shiftKey)}else return;doc.value=buffer;doc.setSelectionRange(buffer.length,buffer.length)});
const rows=[['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal'],['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash'],['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'],['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash']];document.getElementById('kb').innerHTML=rows.map(r=>'<div class=row>'+r.map(c=>'<span class=key>'+KEYMAP[c].n+'<b>'+KEYMAP[c].s+'</b></span>').join('')+'</div>').join('');document.getElementById('kbOn').onchange=e=>document.getElementById('kb').classList.toggle('open',e.target.checked);
</script></body></html>
