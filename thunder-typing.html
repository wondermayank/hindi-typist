{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Thunder Typing",
  "applicationCategory": "EducationalApplication",
  "description": "A plain, full-screen Hindi typing document for CPCT and SSC practice on the Remington GAIL layout.",
  "provider": { "@type": "Organization", "name": "ThunderStudy", "url": "https://commercesehoga.github.io" }
}

<style>
:root{
  --primary:#573AFC; --primary-active:#4527E0;
  --ink:#1d1d1f; --muted:#6b6b6b; --muted-soft:#9a9a9a;
  --hairline:#e6e6e6;
  --canvas:#ffffff;
  --radius-pill:9999px;
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-dev:'Noto Sans Devanagari','Mangal',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:var(--font-ui); background:var(--canvas); color:var(--ink); overflow:hidden;}
button{font-family:var(--font-ui); cursor:pointer; border:none; background:none; color:inherit;}
svg{display:block;}

/* ---------- Loading screen ---------- */
#loading-screen{position:fixed; inset:0; z-index:9999; background:var(--canvas); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; transition:opacity .4s ease;}
#loading-screen.fade-out{opacity:0; pointer-events:none;}
#loading-screen svg circle{stroke:var(--primary); stroke-linecap:round; transform-origin:center; animation:ring-spin 1.1s linear infinite;}
@keyframes ring-spin{ to{ transform:rotate(360deg);} }
.loader-title{font-size:20px; font-weight:700; color:var(--ink);}
.loader-sub{font-size:14px; font-weight:400; color:var(--muted); text-align:center; max-width:280px; line-height:1.5;}

/* ---------- Top-left brand ---------- */
.brand-mark{position:fixed; top:16px; left:20px; z-index:200; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--ink); letter-spacing:-0.1px;}
.brand-mark .dot{width:8px; height:8px; border-radius:50%; background:var(--primary);}
.brand-mark .dev{font-family:var(--font-dev); color:var(--primary); font-weight:500;}

/* ---------- Top-right controls ---------- */
.top-controls{position:fixed; top:12px; right:16px; z-index:200; display:flex; gap:6px;}
.icon-btn{width:38px; height:38px; border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center; color:var(--muted);}
.icon-btn:hover{background:#f7f7f7; color:var(--ink);}
.icon-btn:active{transform:scale(0.92);}

/* ---------- Typing document ---------- */
.doc-wrap{position:fixed; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.doc-pad{min-height:100%; padding:76px 24px 90px; display:flex; justify-content:center;}
textarea#doc{
  width:100%; max-width:820px; min-height:calc(100dvh - 166px);
  border:none; outline:none; resize:none; background:transparent;
  font-family:var(--font-dev); font-size:22px; line-height:2; color:var(--ink);
  caret-color:var(--primary);
}
textarea#doc::placeholder{color:var(--muted-soft); font-family:var(--font-ui); font-size:16px;}

/* ---------- Bottom-right footer ---------- */
.foot{position:fixed; right:14px; bottom:12px; z-index:200;}
.foot-btn{font-size:12px; font-weight:600; color:var(--muted-soft); padding:6px 12px; border-radius:var(--radius-pill); background:rgba(255,255,255,0.9); backdrop-filter:blur(6px); border:1px solid var(--hairline);}
.foot-btn:hover{color:var(--ink); border-color:#d8d8dc;}
.foot-expanded{display:none; align-items:center; gap:10px; font-size:12px; color:var(--muted); padding:8px 14px; border-radius:var(--radius-pill); background:rgba(255,255,255,0.95); backdrop-filter:blur(6px); border:1px solid var(--hairline);}
.foot-expanded a{color:var(--primary); font-weight:600;}
.foot.open .foot-btn{display:none;}
.foot.open .foot-expanded{display:inline-flex;}

@media(max-width:640px){
  textarea#doc{font-size:19px; line-height:1.9;}
  .doc-pad{padding:64px 16px 76px;}
  .brand-mark{font-size:13px;}
}
</style>
</head>
<body>

<div id="loading-screen" aria-hidden="true">
  <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
    <circle cx="28" cy="28" r="23" stroke="#e6e6e6" stroke-width="4"></circle>
    <circle cx="28" cy="28" r="23" stroke-width="4" stroke-dasharray="90 200"></circle>
  </svg>
  <div class="loader-title">Welcome to Thunder Typing</div>
  <div class="loader-sub">Best place for Hindi typing — CPCT &middot; SSC Practice</div>
</div>

<header class="brand-mark">
  <span class="dot"></span>
  Thunder Typing <span class="dev">हिंदी</span>
</header>

<div class="top-controls">
  <button class="icon-btn" id="fullscreen-toggle" aria-label="Toggle full screen" title="Full screen">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
</div>

<main class="doc-wrap" id="doc-wrap">
  <div class="doc-pad">
    <textarea id="doc" placeholder="टाइप करना शुरू करें — इस्तेमाल करें अपना सामान्य कीबोर्ड, Remington GAIL लेआउट पर…" autofocus spellcheck="false"></textarea>
  </div>
</main>

<div class="foot" id="foot">
  <button class="foot-btn" id="foot-btn">wondermayank</button>
  <span class="foot-expanded" id="foot-expanded">
    Thunder Typing by <a href="https://wondermayank.indevs.in" target="_blank" rel="noopener">wondermayank</a> &middot; part of ThunderStudy
  </span>
</div>

<script>
/* ============================================================================
   REMINGTON GAIL KEYMAP — ष/श swapped on the Quote key so shift is now
   normal and normal is now shift (the one requested change).
============================================================================ */
const KEYMAP = {
  Backquote:{n:'़',s:'द्य'}, Digit1:{n:'१',s:'।'}, Digit2:{n:'२',s:'/'}, Digit3:{n:'३',s:':'},
  Digit4:{n:'४',s:'?'}, Digit5:{n:'५',s:'-'}, Digit6:{n:'६',s:'‘'}, Digit7:{n:'७',s:'’'},
  Digit8:{n:'८',s:'द्व'}, Digit9:{n:'९',s:'त्र'}, Digit0:{n:'०',s:'ऋ'}, Minus:{n:'·',s:'्'}, Equal:{n:'ृ',s:'ॄ'},
  KeyQ:{n:'ु',s:'फ'}, KeyW:{n:'ू',s:'ॅ'}, KeyE:{n:'म',s:'म्'}, KeyR:{n:'त',s:'त्'}, KeyT:{n:'ज',s:'ज्'},
  KeyY:{n:'ल',s:'ल्'}, KeyU:{n:'न',s:'न्'}, KeyI:{n:'प',s:'प्'}, KeyO:{n:'व',s:'व्'}, KeyP:{n:'च',s:'च्'},
  BracketLeft:{n:'ख्',s:'क्ष्'}, BracketRight:{n:',',s:'द्व'}, Backslash:{n:'द्ब',s:'द्ध'},
  KeyA:{n:'ं',s:'ॉ'}, KeyS:{n:'े',s:'ै'}, KeyD:{n:'क',s:'क्'}, KeyF:{n:'ि',s:'थ्'}, KeyG:{n:'ह',s:'ळ'},
  KeyH:{n:'ी',s:'भ्'}, KeyJ:{n:'र',s:'श्र'}, KeyK:{n:'ा',s:'ज्ञ'}, KeyL:{n:'स',s:'स्'}, Semicolon:{n:'य',s:'रू'}, Quote:{n:'श्',s:'ष्'},
  KeyZ:{n:'्र',s:'र्'}, KeyX:{n:'ग',s:'ग्'}, KeyC:{n:'ब',s:'ब्'}, KeyV:{n:'अ',s:'ट'}, KeyB:{n:'इ',s:'ठ'},
  KeyN:{n:'द',s:'छ'}, KeyM:{n:'उ',s:'ड'}, Comma:{n:'ए',s:'ढ'}, Period:{n:'ण्',s:'झ'}, Slash:{n:'ध्',s:'घ'},
  Space:{n:' ',s:' '}
};
const HALF_TO_FULL = {'म्':'म','त्':'त','ज्':'ज','ल्':'ल','न्':'न','प्':'प','व्':'व','च्':'च','छ्':'छ','क्':'क','ग्':'ग','ब्':'ब','र्':'र','स्':'स','य्':'य','ष्':'ष','श्':'श','भ्':'भ','थ्':'थ','ख्':'ख','ण्':'ण','ध्':'ध','क्ष्':'क्ष'};
const MATRA_SET = new Set(['ी','ृ','ॉ','ॅ','ॊ','ॆ','ा','ॄ','ः','ो','ौ','े','ै']);
const I_MATRA = 'ि';
// independent vowel (अ/इ/उ) immediately followed by its own matra merges into
// the single independent-vowel character, e.g. अ + ा -> आ, not अा.
const VOWEL_MATRA_TO_FULL = {'अा':'आ','इी':'ई','उू':'ऊ','अो':'ओ','अौ':'औ'};

class RemingtonEngine{
  constructor(){ this.buffer=''; this.pendingI=false; }
  press(code, shift){
    const map = KEYMAP[code];
    if(!map) return '';
    let ch = shift ? map.s : map.n;
    if(ch === I_MATRA){ this.pendingI = true; return ''; }
    let added = '';
    if(this.pendingI){
      let base = ch;
      if(HALF_TO_FULL[base]) base = HALF_TO_FULL[base];
      added = base + I_MATRA;
      this.pendingI = false;
    } else if(MATRA_SET.has(ch) || ch===':'){
      const vowelCombo = this.buffer.slice(-1) + ch;
      if(VOWEL_MATRA_TO_FULL[vowelCombo]){
        // अ/इ/उ immediately followed by its own matra -> single independent vowel
        this.buffer = this.buffer.slice(0, -1);
        added = VOWEL_MATRA_TO_FULL[vowelCombo];
      } else {
        for(const half in HALF_TO_FULL){
          if(this.buffer.endsWith(half)){
            this.buffer = this.buffer.slice(0, -half.length) + HALF_TO_FULL[half];
            break;
          }
        }
        added = ch;
      }
    } else {
      added = ch;
    }
    this.buffer += added;
    return added;
  }
  backspace(){
    if(this.pendingI){ this.pendingI=false; return; }
    this.buffer = this.buffer.slice(0, -1);
  }
  newline(){ this.pendingI=false; this.buffer += '\n'; }
}

/* ============================================================================
   TYPING DOCUMENT — plain page, driven entirely by the Remington GAIL
   engine above so every keystroke maps through the corrected layout.
   Infinite space: the textarea grows with content and the page auto-
   scrolls to the caret so typing always stays in view.
============================================================================ */
const engine = new RemingtonEngine();
const doc = document.getElementById('doc');
const wrap = document.getElementById('doc-wrap');

function autoGrow(){
  doc.style.height = 'auto';
  doc.style.height = doc.scrollHeight + 'px';
}
function scrollToCaret(){
  wrap.scrollTop = wrap.scrollHeight;
}

doc.addEventListener('keydown', (e)=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return; // let copy/paste/shortcuts through
  if(e.code === 'Backspace'){
    e.preventDefault();
    engine.backspace();
    doc.value = engine.buffer;
    autoGrow(); scrollToCaret();
    return;
  }
  if(e.code === 'Enter'){
    e.preventDefault();
    engine.newline();
    doc.value = engine.buffer;
    autoGrow(); scrollToCaret();
    return;
  }
  if(!KEYMAP[e.code]) return; // unmapped keys (arrows, tab, etc.) behave natively
  e.preventDefault();
  engine.press(e.code, e.shiftKey);
  doc.value = engine.buffer;
  doc.setSelectionRange(doc.value.length, doc.value.length);
  autoGrow(); scrollToCaret();
});
doc.addEventListener('click', ()=> doc.setSelectionRange(doc.value.length, doc.value.length));
window.addEventListener('resize', autoGrow);

/* ---------------------------------------------------------------------------
   Full screen toggle — Fullscreen API needs a real user gesture, so it is
   wired to this button rather than firing automatically.
--------------------------------------------------------------------------- */
document.getElementById('fullscreen-toggle').addEventListener('click', ()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.();
  }
  doc.focus();
});

/* ---------------------------------------------------------------------------
   Bottom-right footer — collapsed to just "wondermayank" by default, click
   expands to the full credit line. Stays fixed to the bottom at all times.
--------------------------------------------------------------------------- */
document.getElementById('foot-btn').addEventListener('click', ()=>{
  document.getElementById('foot').classList.add('open');
});
document.getElementById('foot-expanded').addEventListener('click', (e)=>{
  if(e.target.tagName === 'A') return;
  document.getElementById('foot').classList.remove('open');
});

/* ---------------------------------------------------------------------------
   Loading screen — dismiss on load or after 1.5s max, whichever is first.
--------------------------------------------------------------------------- */
function dismissLoader(){
  const el = document.getElementById('loading-screen');
  el.classList.add('fade-out');
  setTimeout(()=>{ el.remove(); doc.focus(); }, 450);
}
if(document.readyState==='complete') dismissLoader();
else window.addEventListener('load', dismissLoader);
setTimeout(dismissLoader, 1500);
</script>
</body>
</html>
